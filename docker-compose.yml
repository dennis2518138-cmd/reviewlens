name: reviewlens

services:
  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
        PIP_TRUSTED_HOST: mirrors.aliyun.com
    image: reviewlens:d8
    ports:
      - "8800:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    init: true
    restart: unless-stopped
